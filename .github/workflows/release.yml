name: Release

# A `v*` tag on main publishes that version: the CI gates run on the tagged
# commit, Linux (static) and macOS binaries are built, the crate goes to crates.io and a
# GitHub Release gets the binaries.
#
# Anything else is a dry run, up to the binaries: a PR that changes this
# workflow or the crate's manifest, or a manual run.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches Cargo.toml and is on main
        id: version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Dry run of version $version"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main"
            exit 1
          fi

  gates:
    name: gates
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Cross-built on Apple silicon; Xcode's clang builds ring for it.
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ring compiles C, with musl-gcc for a static binary.
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc

      - name: Archive
        id: archive
        run: |
          name=issuewright-v${{ needs.verify.outputs.version }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/issuewright README.md LICENSE-MIT LICENSE-APACHE "$name/"
          file "$name/issuewright"
          # A cross-built binary can't run here.
          if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then
            "$name/issuewright" --version
          fi
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: crates.io
    if: github.ref_type == 'tag'
    needs: [verify, gates, build]
    runs-on: ubuntu-latest
    # Trusted Publishing: crates.io trusts this workflow in this environment,
    # so no crates.io token is stored anywhere.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "issuewright ${{ needs.verify.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
