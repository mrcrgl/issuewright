name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same gates on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The live tests talk to GitHub and stay #[ignore]d here.
      - name: Test
        run: cargo test --locked

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

  package:
    name: package / docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Builds the crate as crates.io would get it, so a release can't fail
      # on a file missing from the package (the prompts are include_str!ed).
      - name: Package
        run: cargo package --locked

      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Advisories, licenses, bans and sources; see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
