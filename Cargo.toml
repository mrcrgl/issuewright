[package]
name = "issuewright"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Starts one fresh Claude Code session per GitHub issue labeled dispatch:ready"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrcrgl/issuewright"
readme = "README.md"
keywords = ["github", "claude", "agents", "automation", "daemon"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
jsonwebtoken = "12.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
toml = "1.2.1"
ureq = { version = "2.12.1", features = ["json"] }
